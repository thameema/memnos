[package]
name = "memnos"
version = "0.2.4"
edition = "2021"
autobins = false
build = "rust/build.rs"
description = "Self-hostable, governed, vendor-neutral memory and multi-agent coordination engine (single binary)"
license = "Apache-2.0"
authors = ["Thameem Ansari"]
repository = "https://github.com/thameema/memnos"

[lib]
name = "memnos_core"
path = "rust/src/lib.rs"

[[bin]]
name = "memnos"
path = "rust/src/main.rs"

[[bin]]
name = "memnos-desktop"
path = "rust/src/bin/memnos_desktop.rs"

[dependencies]
tokio = { version = "1.39", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tokio-tungstenite = "0.24"
tower-http = { version = "0.5", features = ["cors"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
aes-gcm = "0.10"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
regex = "1.10"
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
futures-util = "0.3"
anyhow = "1.0"
thiserror = "1.0"
memmap2 = "0.9"
libc = "0.2"
candle-core = { version = "0.8", default-features = false }
candle-nn = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = "0.30"
wry = "0.47"
muda = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.8", default-features = false, features = ["accelerate"] }
candle-nn = { version = "0.8", default-features = false, features = ["accelerate"] }
candle-transformers = { version = "0.8", default-features = false, features = ["accelerate"] }

[profile.release]
opt-level = 3
lto = "thin"
debug = false
strip = true
codegen-units = 1
panic = "abort"
