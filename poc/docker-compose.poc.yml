# POC: single-engine Postgres + pgvector (no AGE, no ArcadeDB, no Qdrant).
# Proves the core decision: HNSW vector index AND tsvector full-text in one engine.
services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: memnos-poc-pg
    environment:
      POSTGRES_USER: memnos
      POSTGRES_PASSWORD: memnos_poc
      POSTGRES_DB: memnos
    ports:
      - "5433:5432"          # 5433 host → avoid colliding with any local pg
    volumes:
      - memnos_poc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memnos -d memnos"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  memnos_poc_pgdata:
