name: Cross-OS Binaries & Release Hygiene (macOS, Linux, Windows)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cross-os:
    name: Build, Archive & Hygiene Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_label: linux-amd64
            ext: ""
          - os: macos-latest
            target_label: darwin-arm64
            ext: ""
          - os: windows-latest
            target_label: windows-amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run engine unit tests
        run: cargo test --lib --release
      - name: Build path-remapped single binary (scripts/build_release.sh)
        shell: bash
        run: bash scripts/build_release.sh
      - name: Package release archive into dist/ (exercised on every push)
        shell: bash
        run: |
          rm -rf dist && mkdir -p dist
          BIN="./target/release/memnos${{ matrix.ext }}"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$BIN' -DestinationPath 'dist/memnos-${{ matrix.target_label }}.zip' -Force"
          else
            tar -czf "dist/memnos-${{ matrix.target_label }}.tar.gz" -C ./target/release memnos
          fi
      - name: Run release hygiene gate on exact binary AND unpacked dist/ archive
        shell: bash
        run: bash scripts/release_hygiene.sh "./target/release/memnos${{ matrix.ext }}"
      - name: Run negative + positive archive leak regression suite
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" tests/test_release_hygiene_gate.py
      - name: Smoke test built release binary (--version and tips)
        shell: bash
        run: |
          BIN="./target/release/memnos${{ matrix.ext }}"
          "$BIN" --version
          "$BIN" tips

  publish-release-binaries:
    name: Upload Verified Release Binary (${{ matrix.target_label }})
    if: github.event_name == 'release'
    needs: test-cross-os
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target_label: linux-amd64
            ext: ""
          - os: macos-latest
            target_label: darwin-arm64
            ext: ""
          - os: windows-latest
            target_label: windows-amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build path-remapped release binary via scripts/build_release.sh
        shell: bash
        run: bash scripts/build_release.sh
      - name: Package release archive into dist/
        shell: bash
        run: |
          rm -rf dist && mkdir -p dist
          BIN="./target/release/memnos${{ matrix.ext }}"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$BIN' -DestinationPath 'dist/memnos-${{ matrix.target_label }}.zip' -Force"
          else
            tar -czf "dist/memnos-${{ matrix.target_label }}.tar.gz" -C ./target/release memnos
          fi
      - name: Enforce release hygiene gate on exact binary AND unpacked dist/ archive
        shell: bash
        run: bash scripts/release_hygiene.sh "./target/release/memnos${{ matrix.ext }}"
      - name: Upload verified release archive to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
