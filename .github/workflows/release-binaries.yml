name: Cross-OS Binaries & Release Hygiene (macOS, Linux, Windows)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test-cross-os:
    name: Build, Unit Suite & Hygiene Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run engine unit tests
        run: cargo test --lib --release
      - name: Build path-remapped single binary (scripts/build_release.sh)
        shell: bash
        run: bash scripts/build_release.sh
      - name: Run release hygiene gate on exact release binary (all OSes incl. Windows)
        shell: bash
        run: bash scripts/release_hygiene.sh ./target/release/memnos
      - name: Smoke test built release binary (--version and tips)
        shell: bash
        run: |
          BIN="./target/release/memnos"
          [[ -f "${BIN}.exe" ]] && BIN="${BIN}.exe"
          "$BIN" --version
          "$BIN" tips
