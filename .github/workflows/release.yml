name: Release to PyPI

# Fires when you publish a GitHub Release (e.g. tag v0.2.0). Builds zero-Python-dependency
# native platform wheels (`memnos` + `memnos-desktop`) across Linux, macOS, and Windows,
# verifies every wheel with `scripts/release_hygiene.sh`, and publishes `memnos`,
# `memnos-sdk`, and `tommy-orchestrator` via PyPI OIDC Trusted Publishing.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-native-wheels:
    name: Build Native Wheel (${{ matrix.wheel_tag }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            wheel_tag: manylinux_2_35_x86_64
            ext: ""
          - os: macos-latest
            wheel_tag: macosx_11_0_arm64
            ext: ""
          - os: windows-latest
            wheel_tag: win_amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build path-remapped binaries via scripts/build_release.sh
        shell: bash
        run: bash scripts/build_release.sh
      - name: Build zero-dep native PyPI wheel
        shell: bash
        run: |
          rm -rf dist && mkdir -p dist
          python scripts/build_native_wheel.py --bin-dir ./target/release --out-dir dist --platform-tag "${{ matrix.wheel_tag }}"
          bash scripts/release_hygiene.sh "./target/release/memnos${{ matrix.ext }}"
      - name: Upload verified wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.wheel_tag }}
          path: dist/*.whl
          if-no-files-found: error

  pypi:
    name: Publish (memnos native wheels + memnos-sdk + tommy-orchestrator)
    needs: build-native-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # required for PyPI Trusted Publishing — no API token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Download native memnos wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/root
          merge-multiple: true

      - name: Build memnos-sdk distribution
        run: |
          python -m pip install --upgrade --quiet build
          python -m build --outdir dist/sdk sdk

      - name: Run release hygiene gate on all PyPI distributions
        shell: bash
        run: |
          ls -la dist/root dist/sdk
          bash scripts/release_hygiene.sh --dist-only dist/root dist/sdk

      - name: Publish memnos (native platform wheels)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/root
          skip-existing: true

      - name: Publish memnos-sdk
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/sdk
          skip-existing: true

      - name: Build tommy-orchestrator distribution
        run: python -m build --outdir dist/tommy agents/tommy

      - name: Publish tommy-orchestrator
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/tommy
          skip-existing: true
