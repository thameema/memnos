name: Release to PyPI

# Fires when you publish a GitHub Release (e.g. tag v0.1.2). That published-release click is
# the deliberate human gate; this job then builds and publishes all three packages to PyPI
# with zero stored secrets, via PyPI Trusted Publishing (OIDC). `skip-existing` means a
# package whose version was already uploaded (e.g. an unchanged memnos-sdk, or a
# memnos-only release that doesn't bump tommy-orchestrator) is skipped, not failed.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    name: Build & publish (memnos + memnos-sdk + tommy-orchestrator)
    runs-on: ubuntu-latest
    permissions:
      id-token: write            # required for PyPI Trusted Publishing — no API token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Build all distributions
        run: |
          python -m pip install --upgrade --quiet build
          python -m build --outdir dist/root .              # the memnos package (repo root)
          python -m build --outdir dist/sdk  sdk             # the memnos-sdk package
          python -m build --outdir dist/tommy agents/tommy   # the tommy-orchestrator package

      - name: Publish memnos
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/root
          skip-existing: true

      - name: Publish memnos-sdk
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/sdk
          skip-existing: true

      - name: Publish tommy-orchestrator
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/tommy
          skip-existing: true
