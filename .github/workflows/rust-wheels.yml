name: Rust Single-Binary CI & Cross-OS Wheels (macOS, Linux, Windows)

on:
  push:
    branches: [feat/rust-single-binary]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test-rust-cross-os:
    name: Cargo Test & Release Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust unit tests
        run: cargo test
      - name: Build single-binary release executable
        run: cargo build --release
      - name: Smoke test binary (--version and tips)
        run: |
          cargo run --release -- --version
          cargo run --release -- tips
