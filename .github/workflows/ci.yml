name: CI

# Runs on every push to master and on every pull request, so a merge can't break the
# branch. Two jobs: the memnos-sdk unit tests, and the full server test suite against a
# real PostgreSQL + pgvector. No OpenAI key needed — the server runs in free local-384
# mode and every test seeds directly / asserts governance, so nothing calls an LLM.
# (The LoCoMo accuracy benchmark is separate and not run in CI.)

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-tests:
    name: SDK unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install './sdk[all]'        # client + langchain/langgraph/llamaindex adapters
      - run: python sdk/tests/test_client.py
      - run: python sdk/tests/test_integrations.py

  server-tests:
    name: Server + governance suite (PG16 + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memnos
          POSTGRES_PASSWORD: memnos_ci
          POSTGRES_DB: memnos
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U memnos -d memnos"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MEMNOS_DSN: postgresql://memnos:memnos_ci@localhost:5433/memnos
      MEMNOS_URL: http://127.0.0.1:8900
      MEMNOS_SECRET_KEY: "Y2lfdGVzdF9rZXlfMzJfYnl0ZXNfZXhhY3RseV9vayE="   # 32B base64, CI-only
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed   # cached across runs (HF rate-limits)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cache embedding/reranker models (HF Hub rate-limits unauthenticated pulls)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-models-v1
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Enable pgvector
        run: PGPASSWORD=memnos_ci psql -h localhost -p 5433 -U memnos -d memnos -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Start server (free local-384 mode) + wait for ready
        run: |
          python memnos_server.py > /tmp/srv.log 2>&1 & echo $! > /tmp/srv.pid
          up=0
          for i in $(seq 1 150); do   # up to 5 min — an uncached run downloads the models
            curl -sf "$MEMNOS_URL/healthz" && { up=1; break; } || sleep 2
          done
          if [ "$up" != 1 ]; then
            echo "::error::server never became ready — log follows"; cat /tmp/srv.log; exit 1
          fi
      - name: Run full test suite
        run: |
          fail=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  cli-smoke:
    # Cross-platform CLI smoke: the installed `memnos` entry point must render help,
    # report a version, pass the docs-staleness gate, and parse --help for EVERY public
    # subcommand — on Linux, macOS, and Windows. No database needed; the PG-backed
    # suite stays on the ubuntu server-tests job above.
    name: CLI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install the package
        run: pip install .
      - name: Help + version render
        shell: bash
        run: |
          memnos --help
          memnos -V
      - name: Docs staleness + per-subcommand parse checks
        shell: bash
        run: python tests/test_cli_docs.py
