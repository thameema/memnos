name: CI

# Runs on every push to master and on every pull request, so a merge can't break the
# branch. Jobs: the memnos-sdk unit tests, the Tommy orchestrator unit tests, the full
# server test suite against a real PostgreSQL + pgvector, and a cross-platform CLI smoke
# test. No OpenAI key needed — the server runs in free local-384 mode and every test
# seeds directly / asserts governance, so nothing calls an LLM.
# (The LoCoMo accuracy benchmark is separate and not run in CI.)

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-tests:
    name: SDK unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install './sdk[all]'        # client + langchain/langgraph/llamaindex adapters
      - run: python sdk/tests/test_client.py
      - run: python sdk/tests/test_integrations.py

  tommy-tests:
    # Previously agents/tommy/tests/* ran nowhere in CI — the hardcoded-v0.1.0
    # banner bug (and the missing --version flag) shipped across three PyPI
    # releases (0.1.0/0.1.1/0.1.2) uncaught because nothing here ever executed
    # this suite. No DB needed: pure unit tests (loopback TCP, real
    # subprocess/signal handling, source-text guards).
    name: Tommy orchestrator unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ./agents/tommy
      - run: pip install pytest
      - run: python -m pytest agents/tommy/tests -q

  server-tests:
    name: Server + governance suite (PG16 + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memnos
          POSTGRES_PASSWORD: memnos_ci
          POSTGRES_DB: memnos
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U memnos -d memnos"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MEMNOS_DSN: postgresql://memnos:memnos_ci@localhost:5433/memnos
      MEMNOS_URL: http://127.0.0.1:8900
      MEMNOS_SECRET_KEY: "Y2lfdGVzdF9rZXlfMzJfYnl0ZXNfZXhhY3RseV9vayE="   # 32B base64, CI-only
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed   # cached across runs (HF rate-limits)
      # Shared 2-core runners rerank ~6x slower than dev hardware (CPU ONNX). The strict
      # 500ms budget is the LOCAL/field gate; CI asserts a looser bound that still catches
      # gross regressions. (tests/test_recall_latency.py reads this.)
      MEMNOS_LATENCY_BUDGET_MS: "1500"
      # tests/test_agent_setup_http_transport.py's Omnigent config-generation contract test
      # (issue #37 Layer 1): provisioned below via clone+sync, so this MUST actually run in
      # CI rather than silently skip — MEMNOS_REQUIRE_OMNIGENT turns a missing checkout/`uv`
      # or a sync timeout into a hard failure here (locally, without it set, they're loud
      # skips instead — see that test's docstring).
      OMNIGENT_REPO: /home/runner/omnigent
      MEMNOS_REQUIRE_OMNIGENT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cache embedding/reranker models (HF Hub rate-limits unauthenticated pulls)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-models-v2          # v1 retired: a partial download had poisoned it
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest    # CI-only: a few pytest-style test files (fixtures/mocks);
                                 # not a production dep, so not in requirements.txt
          pip install ./sdk     # memnos_sdk itself is NOT a memnos dependency (it's the
                                 # separately-published client package) — installed here
                                 # anyway because tests/test_server_setup_omnigent.py now
                                 # exercises `server-setup omnigent`'s real import-check
                                 # precondition (issue #44), which needs a genuine,
                                 # importable memnos_sdk.integrations.omnigent in this job
                                 # for its "happy path" (SDK present) assertions to hold.
                                 # tommy-orchestrator (needed by issue #115's DB-backed Secret
                                 # Shield tests below) is deliberately NOT installed here —
                                 # see the "Install Tommy" step, placed after "Run full test
                                 # suite": tommy pulls in fastmcp (-> mcp, pydantic v2, httpx,
                                 # typer, rich, anyio), and installing it into THIS job's venv
                                 # before the root suite runs risks pip re-resolving one of
                                 # requirements.txt's own pins to satisfy it — letting the root
                                 # suite run to completion first, untouched by tommy's
                                 # dependency closure, removes that risk entirely rather than
                                 # just hoping pip's resolution doesn't move anything.
      - name: Prefetch + verify models (retry; clean-redownload on a corrupt cache)
        # The reranker/embedding ONNX weights are pulled from HF Hub, which rate-limits
        # unauthenticated pulls. A bare constructor is lazy, so a partial/corrupt cache only
        # blows up later when a test loads model.onnx at inference. Here we actually RUN each
        # model (forcing a full, usable download), retry on transient HF failures, and wipe
        # the cache to force a clean re-download if a restored cache is corrupt — so the test
        # suite can never crash on a missing model.onnx again.
        run: |
          cat > /tmp/prefetch_models.py <<'PY'
          import os
          from fastembed import TextEmbedding
          from fastembed.rerank.cross_encoder import TextCrossEncoder
          cache = os.environ.get("FASTEMBED_CACHE_PATH") or None
          list(TextEmbedding(model_name="BAAI/bge-small-en-v1.5", cache_dir=cache).embed(["warm up"]))
          list(TextCrossEncoder(model_name="Xenova/ms-marco-MiniLM-L-6-v2", cache_dir=cache).rerank("q", ["a", "b"]))
          print("models OK")
          PY
          ok=0
          for attempt in 1 2 3; do
            echo "::group::model prefetch attempt $attempt"
            if python /tmp/prefetch_models.py; then ok=1; echo "::endgroup::"; break; fi
            echo "attempt $attempt failed — clearing cache to force a clean re-download"
            rm -rf "${FASTEMBED_CACHE_PATH:?}"/* 2>/dev/null || true
            echo "::endgroup::"
            sleep $((attempt * 20))
          done
          [ "$ok" = 1 ] || { echo "::error::reranker/embedding model download failed after 3 attempts (HF Hub unreachable?)"; exit 1; }
      - name: Enable pgvector
        run: PGPASSWORD=memnos_ci psql -h localhost -p 5433 -U memnos -d memnos -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Install uv (for the Omnigent config-generation contract test)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"       # Omnigent requires Python >=3.12; independent of
          enable-cache: true            # this job's own 3.11 interpreter (setup-python above)
      - name: Clone + sync Omnigent (issue #37 Layer 1 config-generation contract)
        # Public repo, no auth needed. MEMNOS_REQUIRE_OMNIGENT=1 (job env, above) means
        # tests/test_agent_setup_http_transport.py FAILS rather than skips if this step
        # didn't leave a working checkout at $OMNIGENT_REPO. OMNIGENT_SKIP_WEB_UI: the
        # test only needs omnigent.spec.parser/validator (pure Python) — the bundled web
        # UI's `pnpm install --filter web` isn't available on this runner and isn't needed.
        run: |
          git clone --depth 1 https://github.com/omnigent-ai/omnigent "$OMNIGENT_REPO"
          cd "$OMNIGENT_REPO" && OMNIGENT_SKIP_WEB_UI=true uv sync
      - name: Start server (free local-384 mode) + wait for ready
        run: |
          python memnos_server.py > /tmp/srv.log 2>&1 & echo $! > /tmp/srv.pid
          up=0
          # issue #59: poll /readyz, not /healthz. /healthz is cheap liveness by design
          # (200 unconditionally unless MEMNOS_BUDGET_*_USD is set — it never touches
          # POOL) and every test file below is about to send real recall/remember
          # traffic — /readyz actually proves the pool has a connection AND the HNSW
          # vector indexes are responsive (not just that the process is up), which is
          # what this gate is actually supposed to guarantee before the suite runs.
          for i in $(seq 1 150); do   # up to 5 min — an uncached run downloads the models
            curl -sf "$MEMNOS_URL/readyz" && { up=1; break; } || sleep 2
          done
          if [ "$up" != 1 ]; then
            echo "::error::server never became ready — log follows"; cat /tmp/srv.log; exit 1
          fi
      - name: Run full test suite
        run: |
          fail=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - name: Install Tommy (issue #115 DB-backed acceptance tests only)
        # Installed here, AFTER the root suite has already run to completion above —
        # NOT in "Install deps" — so tommy's dependency closure (fastmcp -> mcp,
        # pydantic v2, httpx, typer, rich, anyio) can never cause pip to re-resolve one
        # of requirements.txt's own pins out from under the already-running server /
        # already-executed root suite. AFTER `pip install ./sdk` (also in "Install
        # deps") on purpose too: tommy-orchestrator depends on memnos-sdk>=0.1.27 — if
        # it installed before `./sdk`, pip would satisfy that from PyPI, then the sdk
        # install would silently overwrite it with THIS branch's local checkout;
        # installing tommy after means the local sdk checkout is already in place and
        # pip leaves it alone, so what's under test is unambiguous (the tests below
        # need a real MemnosClient.resolve_secret() from THIS branch, not whatever's
        # latest on PyPI).
        run: pip install -e ./agents/tommy
      - name: Run Tommy Secret Shield DB-backed acceptance tests (issue #115)
        # test_secret_shield_e2e.py / test_secret_shield_ingest_path.py need a real
        # memnos server + Postgres (POST /secret/resolve, POST /ingest/file, and a
        # direct read-back of what actually got stored) — this job already has both
        # running above, so it's the natural home for them rather than duplicating a
        # whole new Postgres+server+model-cache job just for two files. The rest of
        # agents/tommy/tests (pure unit tests, no DB) stays on the fast, DB-free
        # tommy-tests job below. TOMMY_REQUIRE_SECRET_SHIELD=1 turns "server/DB
        # unreachable" into a hard failure instead of the conftest.py's normal local
        # skip — matching this job's own MEMNOS_REQUIRE_OMNIGENT convention above — so
        # these acceptance criteria can't silently stop being exercised in CI.
        env:
          TOMMY_REQUIRE_SECRET_SHIELD: "1"
        run: python -m pytest agents/tommy/tests/test_secret_shield_e2e.py agents/tommy/tests/test_secret_shield_ingest_path.py -v

  cli-smoke:
    # Cross-platform CLI smoke: the installed `memnos` entry point must render help,
    # report a version, pass the docs-staleness gate, and parse --help for EVERY public
    # subcommand — on Linux, macOS, and Windows. No database needed; the PG-backed
    # suite stays on the ubuntu server-tests job above.
    name: CLI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"     # Windows defaults to cp1252; our output is UTF-8 (—, ·, →)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install the package
        run: pip install .
      - name: Help + version render
        shell: bash
        run: |
          memnos --help
          memnos -V
      - name: Docs staleness + per-subcommand parse checks
        shell: bash
        run: python tests/test_cli_docs.py
