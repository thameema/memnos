# docker-compose.test.yml — E2E test stack override
#
# Run alongside the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml \
#     --env-file .env.test -p memnos-test up -d
#
# Differences from prod:
#   - Isolated data dir: ~/.memnos-test  (set via MEMNOS_DATA_DIR in .env.test)
#   - Different host ports:  ArcadeDB 12480/12424, MCP 18765, API 18766
#   - Different container names: memnos-test-arcadedb, memnos-test
#   - open_mode: true (no auth needed for tests)
#
# These ports never conflict with the production stack (2480/2424/8765/8766).

services:
  arcadedb:
    container_name: memnos-test-arcadedb
    ports:
      - "12480:2480"
      - "12424:2424"
    volumes:
      - ${MEMNOS_DATA_DIR:-~/.memnos-test}/arcadedb:/home/arcadedb/databases
      - ${MEMNOS_DATA_DIR:-~/.memnos-test}/arcadedb-logs:/home/arcadedb/log
      - ${MEMNOS_DATA_DIR:-~/.memnos-test}/arcadedb-backups:/home/arcadedb/backups

  memnos:
    container_name: memnos-test
    ports:
      - "18765:8765"
      - "18766:8766"
    environment:
      ARCADEDB_HOST: arcadedb
      ARCADEDB_PORT: 2480
    volumes:
      - ./memnos.yaml:/app/memnos.yaml:ro
      - ./agents:/app/agents:ro
      - ./skills:/app/skills:ro
      - ${MEMNOS_DATA_DIR:-~/.memnos-test}:/root/.memnos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8766/api/v1/admin/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
