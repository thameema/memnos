[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memnos-orchestrator"
version = "0.1.0"
description = "memnos multi-agent orchestrator"
requires-python = ">=3.11"
dependencies = [
    "memnos-core",
    "anthropic>=0.30",
    "openai>=1.30",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["memnos_orchestrator*"]
