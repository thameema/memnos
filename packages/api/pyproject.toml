[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memnos-api"
version = "0.1.0"
description = "memnos REST API server"
requires-python = ">=3.11"
dependencies = [
    "memnos-core",
    "memnos-orchestrator",
    "memnos-mcp-server",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["memnos_api*"]

[project.scripts]
memnos-server = "memnos_api.main:main"
