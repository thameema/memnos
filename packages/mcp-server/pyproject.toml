[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memnos-mcp-server"
version = "0.1.0"
description = "memnos MCP server — stdio and SSE transports"
requires-python = ">=3.11"
dependencies = [
    "memnos-core",
    "mcp>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["memnos_mcp*"]

[project.scripts]
memnos-mcp = "memnos_mcp.server:main"
memnos-mcp-stdio = "memnos_mcp.transports.stdio:main"
