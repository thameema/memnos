[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memnos-core"
version = "0.2.0"
description = "memnos persistent memory core — ArcadeDB knowledge graph + vector store"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.30",
    "anthropic>=0.30",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# pip install 'memnos-core[local-embeddings]'
# Adds sentence-transformers + torch (~2 GB). Use provider: local in memnos.yaml.
local-embeddings = [
    "sentence-transformers>=2.7",
    "spacy>=3.7",
]
# pip install 'memnos-core[voyage]'
# Lightweight Voyage AI client. Use provider: voyage in memnos.yaml.
voyage = ["voyageai>=0.2"]
# pip install 'memnos-core[qdrant]'
# Enables MEMNOS_VECTOR_BACKEND=qdrant — HNSW ANN search via Qdrant.
qdrant = ["qdrant-client>=1.9"]
# pip install 'memnos-core[community]'
# Adds networkx for Louvain/greedy community detection (Feature 3.4).
community = ["networkx>=3.0"]
all = ["memnos-core[local-embeddings,voyage,qdrant,community]"]

[project.scripts]
memnos-import = "memnos.cli.import_cmd:main"
memnos-git = "memnos.cli.git_hooks:main"
memnos-decay = "memnos.cli.decay_cli:main"
memnos-vault = "memnos.cli.vault_cli:main"
memnos-community = "memnos.cli.community_cli:main"
memnos-migrate = "memnos.cli.migrate_cli:main"
memnos-export = "memnos.cli.export_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["memnos*"]
