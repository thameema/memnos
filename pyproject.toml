[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memnos"
version = "0.1.0"
description = "Self-hostable, governed, vendor-neutral memory for AI agents (PostgreSQL + pgvector)."
readme = "QUICKSTART.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "httpx>=0.27",
    "openai>=1.40",
    "sentence-transformers>=3.0",
    "mcp>=1.2",
    "python-dateutil>=2.9",
    "cryptography>=42",
]

[project.scripts]
memnos = "memnos_cli:main"

# Optional: PDF/DOCX text extraction for `memnos`/REST file ingest (else send extracted text).
[project.optional-dependencies]
files = ["pypdf>=4", "python-docx>=1.1"]

# Ship the single `core` engine package + the top-level server/CLI/MCP modules + the
# console UI as data. Benchmarks and dev/eval scripts run from source and are not packaged.
[tool.setuptools]
packages = ["core"]
py-modules = ["memnos_cli", "memnos_server", "memnos_admin", "memnos_mcp", "nsresolve"]

[tool.setuptools.package-data]
core = ["schema.sql"]

[tool.setuptools.data-files]
"share/memnos/ui" = ["ui/index.html", "ui/app.js", "ui/app.css"]
