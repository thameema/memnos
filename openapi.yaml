openapi: "3.1.0"
info:
  title: memnos API
  version: "0.1.6"
  description: |
    The complete public REST surface of the memnos memory server (`memnos_server.py`).

    Three groups:
    - **Data plane** — `POST` JSON endpoints for remembering, recalling, and managing
      memories. Every request body carries a `namespace`; access is clamped server-side
      to the authenticated principal's grants.
    - **Health** — unauthenticated liveness (`/healthz`) and readiness (`/readyz`),
      plus an authenticated `/metrics` rollup.
    - **Admin plane** — `/admin/api/*` management endpoints. These require a token whose
      principal holds the `*` grant (an *admin* token).

    ### Authentication
    `Authorization: Bearer mnk_...` on every endpoint except `/healthz` and `/readyz`.
    Tokens are minted server-side (`memnos token mint <principal>`); only a hash is stored.

    ### Error taxonomy
    Every error is a JSON object `{"error": "...", "msg"?: "..."}`:
    - `400` — malformed JSON, missing/oversized required fields, bad content-length.
    - `401` — missing/invalid/revoked/expired bearer token.
    - `403` — authenticated, but the namespace is outside the principal's grants
      (or a non-admin token on the admin plane). Denials are audited.
    - `404` — unknown route, or the referenced object is not in this namespace.
    - `409` — admin secrets endpoints only: the vault is locked (no `MEMNOS_SECRET_KEY`).
    - `413` — request body over the 256 KB cap (`/ingest/file`: extracted text over 2 MB).
    - `415` — `/ingest/file` only: binary upload whose text cannot be extracted.
    - `429` — **not used**: the server has no rate limiting; put a reverse proxy in front
      if you need one.
    - `500` — internal fault. Audited with the error type; details are never leaked.
    - `503` — database unreachable (`{"error": "database unreachable — is Postgres
      running?"}`). Clients should fail fast, not retry-storm.

    ### Out of scope
    - The **capture proxy** (`memnos proxy`, default :8910) is a separate relay process.
      Its surface is vendor-shaped passthrough (`/v1/chat/completions`, `/v1/messages`,
      …) plus its own `/healthz`; it is deliberately NOT part of this contract.
    - The `/admin` static console (HTML/JS/CSS) — UI assets, not API.
  license:
    name: Apache-2.0
servers:
  - url: http://127.0.0.1:8900
security:
  - bearerAuth: []

tags:
  - name: memory
    description: Remember / recall / memory CRUD
  - name: graph
    description: Entity graph, communities, contradictions, knowledge health
  - name: episodes
    description: Episodic tier (segmentation, recall, decay)
  - name: corpus
    description: Architecture-constraint corpus
  - name: pubsub
    description: Namespace subscriptions (poll feed + webhooks)
  - name: health
    description: Liveness / readiness / metrics
  - name: admin
    description: Management plane (`*`-grant token required)

paths:
  # ───────────────────────── health ─────────────────────────
  /healthz:
    get:
      tags: [health]
      summary: Liveness — process is up
      security: []
      responses:
        "200":
          description: alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Healthz" }
  /readyz:
    get:
      tags: [health]
      summary: Readiness — database reachable
      security: []
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readyz" }
        "503":
          description: database unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readyz" }
  /metrics:
    get:
      tags: [health]
      summary: 24h reliability rollup (any valid token)
      responses:
        "200":
          description: per-op stats over the last 24h
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }

  # ───────────────────────── memory ─────────────────────────
  /remember:
    post:
      tags: [memory]
      summary: Store a conversational turn (+ LLM fact extraction in OpenAI mode)
      description: |
        Stores the redacted verbatim turn, then (OpenAI mode only) extracts bi-temporal
        facts. `{"async": true}` defers extraction to background workers and returns
        immediately after the raw turn is stored (`"extraction": "queued"`, `facts: null`).
        In local-embedding mode there is no extraction and `facts` is always `0`.
        The memory's author is ALWAYS the authenticated principal — never client-supplied.
        An optional `type` (decision | incident | constraint | skill | fact) classifies
        the memory; extracted facts inherit the turn's type, and `constraint` memories
        are pinned into every recall on the namespace.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RememberRequest" }
      responses:
        "200":
          description: turn stored (facts extracted, or queued when async)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RememberResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /memory/write:
    post:
      tags: [memory]
      summary: Alias of /remember (accepts `text` or `content`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryWriteRequest" }
      responses:
        "200":
          description: turn stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RememberResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /recall:
    post:
      tags: [memory]
      summary: Hybrid recall (memories + paste-ready context)
      description: |
        Hybrid vector+FTS retrieval with cross-encoder rerank. With `"scope": "all"` (or
        `"wide"`) recall widens across every namespace the token may read and the response
        gains `namespaces_searched`. **Grounded recall**: when the namespace has admin-made
        links to knowledge namespaces, linked namespaces the CALLER may read are searched
        too — `grounded_in` lists those used, `links_skipped` those denied by grants (both
        keys appear only when links exist). `author` filters results to one writer
        (matched against the server-stamped author). `type` filters results to one memory
        type. **Pinned constraints**: memories typed `constraint` in the target namespace
        (and its grant-readable linked namespaces) are ALWAYS included — first in the
        output and rendered as leading `CONSTRAINT: ...` context lines — regardless of
        query similarity; cap with `constraint_cap` (default 10, 0 disables).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecallRequest" }
      responses:
        "200":
          description: ranked memories + rendered context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecallResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /memory/search:
    post:
      tags: [memory]
      summary: Recall, memories only (no context block)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecallRequest" }
      responses:
        "200":
          description: ranked memories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoriesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /recall_v2:
    post:
      tags: [memory]
      summary: Alias of /memory/search
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecallRequest" }
      responses:
        "200":
          description: ranked memories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoriesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /memory/context:
    post:
      tags: [memory]
      summary: Recall, context block only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecallRequest" }
      responses:
        "200":
          description: rendered context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /memory/delete:
    post:
      tags: [memory]
      summary: Expire a semantic fact by id (system-time delete)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdRequest" }
      responses:
        "200":
          description: fact expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /consolidate:
    post:
      tags: [memory]
      summary: Build entity dossiers from stored facts (offline LLM pass)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NamespaceOnlyRequest" }
      responses:
        "200":
          description: dossiers written (0 in local mode — needs an LLM)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsolidateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /feedback:
    post:
      tags: [memory]
      summary: Record whether a recall was helpful (quality signal)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackRequest" }
      responses:
        "200":
          description: recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /reconcile:
    post:
      tags: [memory]
      summary: Reconcile an external claim against stored facts (staleness check)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileRequest" }
      responses:
        "200":
          description: matches + conflicts + staleness verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /ingest/file:
    post:
      tags: [memory]
      summary: Ingest a document (text or base64 PDF/DOCX) as chunked memories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestFileRequest" }
      responses:
        "200":
          description: chunks stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestFileResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415":
          description: cannot extract text from the upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /namespace/copy:
    post:
      tags: [memory]
      summary: Copy or move memories between namespaces
      description: |
        `namespace` is the DESTINATION (write grant required); `src` needs a read grant.
        `mode` is `copy` (default) or `move`; `like` filters by substring.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NamespaceCopyRequest" }
      responses:
        "200":
          description: migration counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NamespaceCopyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }

  # ───────────────────────── graph ─────────────────────────
  /entity:
    post:
      tags: [graph]
      summary: Entity + neighbourhood + facts that mention it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntityRequest" }
      responses:
        "200":
          description: entity dossier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /provenance:
    post:
      tags: [graph]
      summary: Evidence chain for a fact (verbatim source turns)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdRequest" }
      responses:
        "200":
          description: fact + sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvenanceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /related:
    post:
      tags: [graph]
      summary: Direct graph neighbours of an entity (weight-ranked)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
      responses:
        "200":
          description: adjacency list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelatedResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /graph:
    post:
      tags: [graph]
      summary: N-hop graph expansion → facts about the reachable entity set
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GraphRequest" }
      responses:
        "200":
          description: facts reachable from the seed entities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /community:
    post:
      tags: [graph]
      summary: Connected component (community) an entity belongs to
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
      responses:
        "200":
          description: community members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /contradictions:
    post:
      tags: [graph]
      summary: Same subject+predicate with multiple current objects
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NamespaceOnlyRequest" }
      responses:
        "200":
          description: potential contradictions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContradictionsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /knowledge/health:
    post:
      tags: [graph]
      summary: 0-100 structural health score for a namespace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NamespaceOnlyRequest" }
      responses:
        "200":
          description: health metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeHealthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }

  # ───────────────────────── episodes ─────────────────────────
  /episode:
    post:
      tags: [episodes]
      summary: Fetch one episode (+ turns + derived facts) by id
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdRequest" }
      responses:
        "200":
          description: the episode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /episode/segment:
    post:
      tags: [episodes]
      summary: Segment uncovered raw turns into episodes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpisodeSegmentRequest" }
      responses:
        "200":
          description: number of episodes created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeSegmentResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /episode/recall:
    post:
      tags: [episodes]
      summary: Semantic search over episodes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpisodeRecallRequest" }
      responses:
        "200":
          description: matching episodes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeRecallResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /episode/decay:
    post:
      tags: [episodes]
      summary: Recompute episode salience (half-life decay + access boost)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpisodeDecayRequest" }
      responses:
        "200":
          description: episodes updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeDecayResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }

  # ───────────────────────── corpus ─────────────────────────
  /corpus/ingest:
    post:
      tags: [corpus]
      summary: Parse RFC-2119 constraints out of a doc into facts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorpusIngestRequest" }
      responses:
        "200":
          description: constraints stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorpusIngestResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /corpus/check:
    post:
      tags: [corpus]
      summary: Constraints relevant to a code snippet (FTS)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorpusCheckRequest" }
      responses:
        "200":
          description: relevant constraints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorpusCheckResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /corpus/list:
    post:
      tags: [corpus]
      summary: Registered corpus sources for a namespace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NamespaceOnlyRequest" }
      responses:
        "200":
          description: source registry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorpusListResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }

  # ───────────────────────── pubsub ─────────────────────────
  /subscribe:
    post:
      tags: [pubsub]
      summary: Subscribe to a namespace (poll cursor, optional webhook)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscribeRequest" }
      responses:
        "200":
          description: subscription created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscribeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /feed:
    post:
      tags: [pubsub]
      summary: Poll new memories since the subscription cursor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedRequest" }
      responses:
        "200":
          description: new items; cursor advanced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/DbDown" }
  /unsubscribe:
