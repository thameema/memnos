components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "mnk_<token>"

  responses:
    BadRequest:
      description: malformed request (missing/oversized field, invalid JSON)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: missing/invalid/revoked bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: namespace (or admin plane) outside the principal's grants
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: object not found in this namespace (or unknown route)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: payload over the size cap (256 KB request / 2 MB extracted text)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VaultLocked:
      description: secret vault locked — MEMNOS_SECRET_KEY not set
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: internal fault (audited; no details leaked)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DbDown:
      description: database unreachable — fail fast, check Postgres
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # NUMERIC NOTE: SQL aggregates (round/avg/sum) surface as Postgres `numeric` →
    # Python Decimal → serialized by `json.dumps(default=str)` as a STRING. Fields fed
    # by such aggregates are therefore typed as number-or-string. Same for timestamps:
    # datetime → ISO-ish string.
    SqlNumber:
      description: numeric that may serialize as a JSON string (Postgres numeric/Decimal)
      type: [number, integer, string, "null"]
    DateTime:
      description: timestamp serialized as a string (str(datetime))
      type: [string, "null"]

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        msg: { type: string }

    Healthz:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    Readyz:
      type: object
      required: [ready]
      properties:
        ready: { type: boolean }
    Metrics:
      type: object
      required: [window_hours, ops]
      properties:
        window_hours: { type: integer }
        ops:
          type: array
          items: { $ref: "#/components/schemas/OpStats" }
    OpStats:
      type: object
      required: [action, calls]
      properties:
        action: { type: string }
        calls: { type: integer }
        error_pct: { $ref: "#/components/schemas/SqlNumber" }
        acl_denied_pct: { $ref: "#/components/schemas/SqlNumber" }
        p50_ms: { type: [integer, "null"] }
        p95_ms: { type: [integer, "null"] }
        recall_empty_pct: { $ref: "#/components/schemas/SqlNumber" }

    # ── requests ──
    NamespaceOnlyRequest:
      type: object
      required: [namespace]
      properties:
        namespace: { type: string, maxLength: 200 }
    RememberRequest:
      type: object
      required: [namespace, text]
      properties:
        namespace: { type: string, maxLength: 200 }
        text: { type: string, maxLength: 20000 }
        speaker: { type: string, description: "e.g. user / assistant" }
        session_id: { type: string }
        type:
          type: string
          enum: [decision, incident, constraint, skill, fact]
          description: >
            classify the memory; facts extracted from the turn inherit it. Unknown
            values are rejected (400). `constraint` memories are PINNED into every
            recall on the namespace.
        async:
          type: boolean
          description: defer fact extraction to background workers (fast return)
    MemoryWriteRequest:
      type: object
      required: [namespace]
      description: alias body — `text` or `content` (one required)
      properties:
        namespace: { type: string, maxLength: 200 }
        text: { type: string, maxLength: 20000 }
        content: { type: string, maxLength: 20000 }
        speaker: { type: string }
        session_id: { type: string }
        type:
          type: string
          enum: [decision, incident, constraint, skill, fact]
        async: { type: boolean }
    RecallRequest:
      type: object
      required: [namespace, query]
      properties:
        namespace: { type: string, maxLength: 200 }
        query: { type: string, maxLength: 4000 }
        scope:
          type: string
          enum: [all, wide]
          description: "/recall only: widen across every readable namespace"
        author:
          type: string
          description: only memories written by this principal (server-stamped author)
        type:
          type: string
          enum: [decision, incident, constraint, skill, fact]
          description: >
            only memories of this type. Pinned constraints are exempt — they are always
            injected (disable with constraint_cap=0).
        constraint_cap:
          type: integer
          description: >
            max pinned constraints injected (default 10, clamped 0..50; 0 disables
            pinning). Pinned rows are ADDED ahead of ranked results, never replace them.
        raw_quota: { type: integer, description: max verbatim turns returned }
        fact_quota: { type: integer, description: max facts returned }
        max_chars: { type: integer, description: context block size cap (default 9000) }
    IdRequest:
      type: object
      required: [namespace, id]
      properties:
        namespace: { type: string, maxLength: 200 }
        id: { type: integer }
    NameRequest:
      type: object
      required: [namespace, name]
      properties:
        namespace: { type: string, maxLength: 200 }
        name: { type: string }
    EntityRequest:
      type: object
      required: [namespace, name]
      properties:
        namespace: { type: string, maxLength: 200 }
        name: { type: string }
        depth: { type: integer, minimum: 1, maximum: 3 }
    GraphRequest:
      type: object
      required: [namespace]
      description: seed with `entities[]` or a single `name`
      properties:
        namespace: { type: string, maxLength: 200 }
        entities:
          type: array
          items: { type: string }
          maxItems: 10
        name: { type: string }
        hops: { type: integer, minimum: 1, maximum: 3 }
        limit: { type: integer }
    FeedbackRequest:
      type: object
      required: [namespace, helpful]
      properties:
        namespace: { type: string, maxLength: 200 }
        query: { type: string, maxLength: 1000 }
        helpful: { type: boolean }
        note: { type: string }
    ReconcileRequest:
      type: object
      required: [namespace, statement]
      properties:
        namespace: { type: string, maxLength: 200 }
        statement: { type: string, maxLength: 4000 }
        subject: { type: string }
        predicate: { type: string }
    IngestFileRequest:
      type: object
      required: [namespace]
      description: send extracted `text`, or `content_b64` (PDF/DOCX need pypdf/python-docx)
      properties:
        namespace: { type: string, maxLength: 200 }
        filename: { type: string }
        text: { type: string }
        content_b64: { type: string, contentEncoding: base64 }
        extract: { type: boolean, description: also run LLM fact extraction per chunk }
        chunk_size: { type: integer }
    NamespaceCopyRequest:
      type: object
      required: [namespace, src]
      properties:
        namespace: { type: string, maxLength: 200, description: DESTINATION namespace }
        src: { type: string, description: source namespace (read grant required) }
        mode: { type: string, enum: [copy, move] }
        like: { type: string, description: substring filter }
    EpisodeSegmentRequest:
      type: object
      required: [namespace]
      properties:
        namespace: { type: string, maxLength: 200 }
        gap_minutes: { type: integer }
    EpisodeRecallRequest:
      type: object
      required: [namespace, query]
      properties:
        namespace: { type: string, maxLength: 200 }
        query: { type: string, maxLength: 4000 }
        k: { type: integer }
    EpisodeDecayRequest:
      type: object
      required: [namespace]
      properties:
        namespace: { type: string, maxLength: 200 }
        half_life_days: { type: number }
    CorpusIngestRequest:
      type: object
      required: [namespace, name, text]
      properties:
        namespace: { type: string, maxLength: 200 }
        name: { type: string, description: source name (re-ingest replaces) }
        text: { type: string }
        kind: { type: string, description: "default 'doc'" }
        git_sha: { type: string }
    CorpusCheckRequest:
      type: object
      required: [namespace]
      description: "`snippet` or `code` (one required)"
      properties:
        namespace: { type: string, maxLength: 200 }
        snippet: { type: string }
        code: { type: string }
    SubscribeRequest:
      type: object
      required: [namespace]
      properties:
        namespace: { type: string, maxLength: 200 }
        webhook: { type: string, description: optional push URL }
    FeedRequest:
      type: object
      required: [namespace, subscription_id]
      properties:
        namespace: { type: string, maxLength: 200 }
        subscription_id: { type: integer }
        limit: { type: integer }
    UnsubscribeRequest:
      type: object
      required: [namespace, subscription_id]
      properties:
        namespace: { type: string, maxLength: 200 }
        subscription_id: { type: integer }

    # ── data-plane responses ──
    RememberResponse:
      type: object
      required: [turn_id, facts]
      properties:
        turn_id: { type: integer }
        facts:
          type: [integer, "null"]
          description: "null when extraction was queued (async)"
        superseded: { type: integer }
        extraction:
          type: string
          enum: [queued]
          description: present only on the async path
    MemoryRow:
      type: object
      required: [content, kind]
      properties:
        content: { type: string }
        kind: { type: string, enum: [turn, fact, episode] }
        score: { type: number }
        date: { type: [string, "null"], description: fact valid_from (YYYY-MM-DD) }
        author: { type: string, description: server-stamped writing principal }
        namespace: { type: string, description: source namespace (wide/grounded rows) }
        type:
          type: string
          enum: [decision, incident, constraint, skill, fact]
          description: memory type (absent = untyped)
        pinned:
          type: boolean
          description: >
            true on injected constraint rows — present regardless of query similarity,
            rendered first in the context block as "CONSTRAINT: ..." lines
        superseded:
          type: boolean
          description: >
            turn rows only — true when EVERY semantic fact derived from this turn has
            been superseded (the turn is verbatim history of a state that no longer
            holds). Such turns are demoted below current facts in the ranking and
            rendered as "- (said, superseded as of <date>) ..." in the context block.
        superseded_at:
          type: string
          description: >
            turn rows only, with `superseded` — close-out date (YYYY-MM-DD) of the
            latest superseding transition
    RecallResponse:
      type: object
      required: [memories, context]
      properties:
        memories:
          type: array
          items: { $ref: "#/components/schemas/MemoryRow" }
        context: { type: string }
        grounded_in:
          type: array
          items: { type: string }
          description: linked knowledge namespaces searched (only when links exist)
        links_skipped:
          type: array
          items: { type: string }
          description: linked namespaces skipped — caller lacks a read grant
        namespaces_searched:
          type: array
          items: { type: string }
          description: wide scope only
    MemoriesResponse:
      type: object
      required: [memories]
      properties:
        memories:
          type: array
          items: { $ref: "#/components/schemas/MemoryRow" }
        grounded_in:
          type: array
          items: { type: string }
        links_skipped:
          type: array
          items: { type: string }
    ContextResponse:
      type: object
      required: [context]
      properties:
        context: { type: string }
        grounded_in:
          type: array
          items: { type: string }
        links_skipped:
          type: array
          items: { type: string }
    ConsolidateResponse:
      type: object
      required: [dossiers]
      properties:
        dossiers: { type: integer }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    DeleteResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer }
        statement: { type: [string, "null"] }
    EntityResponse:
      type: object
      required: [entity, related, facts]
      properties:
        entity:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        related:
          type: array
          items: { $ref: "#/components/schemas/RelatedRow" }
        facts:
          type: array
          items:
            type: object
            required: [id, content]
            properties:
              id: { type: integer }
              content: { type: string }
              valid_from: { $ref: "#/components/schemas/DateTime" }
              valid_to: { $ref: "#/components/schemas/DateTime" }
    RelatedRow:
      type: object
      required: [name, weight]
      properties:
        name: { type: string }
        weight: { type: number }
    RelatedResponse:
      type: object
      required: [name, related]
      properties:
        name: { type: string }
        related:
          type: array
          items: { $ref: "#/components/schemas/RelatedRow" }
    GraphResponse:
      type: object
      required: [facts]
      properties:
        facts:
          type: array
          items:
            type: object
            required: [id, content]
            properties:
              id: { type: integer }
              content: { type: string }
              valid_from: { $ref: "#/components/schemas/DateTime" }
    ProvenanceResponse:
      type: object
      required: [fact, source_turn_ids, sources]
      properties:
        fact:
          type: object
          required: [id, kind, statement]
          properties:
            id: { type: integer }
            kind: { type: string }
            statement: { type: string }
            valid_from: { $ref: "#/components/schemas/DateTime" }
            valid_to: { $ref: "#/components/schemas/DateTime" }
        source_turn_ids:
          type: array
          items: { type: integer }
        sources:
          type: array
          items: { $ref: "#/components/schemas/TurnRow" }
    TurnRow:
      type: object
      required: [id, content]
      properties:
        id: { type: integer }
        speaker: { type: [string, "null"] }
        content: { type: string }
        observed_at: { $ref: "#/components/schemas/DateTime" }
    CommunityResponse:
      type: object
      required: [entity, community, size]
      properties:
        entity: { type: string }
        community:
          type: array
          items: { type: string }
        size: { type: integer }
    ContradictionsResponse:
      type: object
      required: [contradictions]
      properties:
        contradictions:
          type: array
          items:
            type: object
            required: [subject, predicate, objects, ids]
            properties:
              subject: { type: string }
              predicate: { type: string }
              objects:
                type: array
                items: { type: string }
              ids:
                type: array
                items: { type: integer }
    KnowledgeHealthResponse:
      type: object
      required: [score, facts_current, facts_superseded, facts_expired, entities,
                 orphan_entities, contradiction_groups]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        facts_current: { type: integer }
        facts_superseded: { type: integer }
        facts_expired: { type: integer }
        entities: { type: integer }
        orphan_entities: { type: integer }
        contradiction_groups: { type: integer }
    NamespaceCopyResponse:
      type: object
      required: [mode, src, dst, raw_turns, facts, episodes]
      properties:
        mode: { type: string, enum: [copy, move] }
        src: { type: string }
        dst: { type: string }
        raw_turns: { type: integer }
        facts: { type: integer }
        episodes: { type: integer }
    EpisodeResponse:
      type: object
      required: [episode, turns, facts]
      properties:
        episode:
          type: object
          required: [id]
          properties:
            id: { type: integer }
            session_id: { type: [string, "null"] }
            summary: { type: [string, "null"] }
            text: { type: string }
            t_start: { $ref: "#/components/schemas/DateTime" }
            t_end: { $ref: "#/components/schemas/DateTime" }
            salience: { type: number }
            access_count: { type: integer }
            source_turn_ids:
              type: array
              items: { type: integer }
            memory_type:
              type: [string, "null"]
              enum: [decision, incident, constraint, skill, fact, null]
              description: inherited when ALL source turns share one type (else null)
        turns:
          type: array
          items: { $ref: "#/components/schemas/TurnRow" }
        facts:
          type: array
          items:
            type: object
            required: [id, statement]
            properties:
              id: { type: integer }
              statement: { type: string }
    EpisodeSegmentResponse:
      type: object
      required: [episodes]
      properties:
        episodes: { type: integer, description: episodes created }
    EpisodeRecallResponse:
      type: object
      required: [episodes]
      properties:
        episodes:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: integer }
              summary: { type: [string, "null"] }
              content: { type: string }
              t_start: { $ref: "#/components/schemas/DateTime" }
              t_end: { $ref: "#/components/schemas/DateTime" }
              salience: { type: number }
              memory_type:
                type: [string, "null"]
                enum: [decision, incident, constraint, skill, fact, null]
                description: inherited when ALL source turns share one type (else null)
              score:
                $ref: "#/components/schemas/SqlNumber"
    EpisodeDecayResponse:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }
    ReconcileResponse:
      type: object
      required: [claim, matches, conflicts, stale]
      properties:
        claim: { type: string }
        matches:
          type: array
          items: { $ref: "#/components/schemas/ReconcileMatch" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/ReconcileMatch" }
        stale: { type: boolean }
    ReconcileMatch:
      type: object
      required: [id, statement, conflict]
      properties:
        id: { type: integer }
        statement: { type: string }
        subject: { type: [string, "null"] }
        predicate: { type: [string, "null"] }
        object: { type: [string, "null"] }
        valid_from: { $ref: "#/components/schemas/DateTime" }
        conflict: { type: boolean }
    IngestFileResponse:
      type: object
      required: [filename, chunks, turn_ids]
      properties:
        filename: { type: string }
        chunks: { type: integer }
        turn_ids:
          type: array
          items: { type: integer }
    CorpusIngestResponse:
      type: object
      required: [source, constraints, ids]
      properties:
        source: { type: string }
        constraints: { type: integer }
        ids:
          type: array
          items: { type: integer }
    CorpusCheckResponse:
      type: object
      required: [constraints]
      properties:
        constraints:
          type: array
          items:
            type: object
            required: [id, content, source]
            properties:
              id: { type: integer }
              content: { type: string }
              source: { type: string }
              score: { type: number }
    CorpusListResponse:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
              kind: { type: [string, "null"] }
              git_sha: { type: [string, "null"] }
              constraint_count: { type: integer }
              ingested_at: { $ref: "#/components/schemas/DateTime" }
    SubscribeResponse:
      type: object
      required: [subscription_id, namespace, cursor]
      properties:
        subscription_id: { type: integer }
        namespace: { type: string }
        cursor: { type: integer }
        webhook: { type: [string, "null"] }
    FeedResponse:
      type: object
      required: [subscription_id, items, cursor]
      properties:
        subscription_id: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/TurnRow" }
        cursor: { type: integer }
    UnsubscribeResponse:
      type: object
      required: [unsubscribed]
      properties:
        unsubscribed: { type: boolean }

    # ── admin responses ──
    OkNameResponse:
