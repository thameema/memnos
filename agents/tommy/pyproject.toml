[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tommy-orchestrator"
version = "0.1.6"
description = "Tommy — a personal coding orchestrator built on memnos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "memnos-sdk>=0.1.27",
    "httpx>=0.27",
    "fastmcp>=2.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tommy = "tommy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["tommy"]

[tool.hatch.build]
include = [
    "tommy/**",
]
